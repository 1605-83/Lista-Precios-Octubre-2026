name: Actualizar listas de precios desde Gescom

on:
  schedule:
    - cron: '20 8-23 * * 1-6'   # cada hora de 05:20 a 20:20 hora argentina, lunes a sabado
    - cron: '0 12 * * *'       # todos los dias a las 09:00 hora argentina (incluido domingo), pedido de Bruno
  workflow_dispatch:            # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Solo escribe datos.json si cambio algun precio, producto o cantidad
      - name: Leer los precios de la base de Gescom
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\actualizar.ps1 -Salida .

      # Lista 2 (mayorista): mismos productos y reglas, archivos datos-l2.json y datos-otm-l2.json
      - name: Leer la Lista 2 (mayorista)
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\actualizar.ps1 -Salida . -Lista 2 -Sufijo -l2

      - name: Rearmar el Excel si cambiaron las listas
        shell: bash
        run: |
          if git diff --quiet -- datos.json; then
            echo "Sin cambios en las listas"
          else
            powershell -NoProfile -File robot/excel.ps1 -Carpeta .
          fi

      - name: Subir los cambios
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json datos-otm.json "Listas de precios LP - ELEBES.xlsx"
          git add datos-l2.json datos-otm-l2.json datos-riosma.json datos-riosma-l2.json datos-ilolay.json datos-ilolay-l2.json stock.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Listas de precios actualizadas desde Gescom ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            git push
          fi
