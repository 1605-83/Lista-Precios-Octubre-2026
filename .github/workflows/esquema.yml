name: Esquema de la base (solo totales por deposito)
on: workflow_dispatch
jobs:
  esquema:
    runs-on: windows-latest
    steps:
      - name: Depositos del stock (totales, sin articulos)
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: |
          $h = @{ Authorization = "Bearer $env:GESCOM_LPE_CLAVE" }
          $b = 'https://datos-gescom.panelempresas.workers.dev'
          $sql = "SELECT deposito, sede, COUNT(DISTINCT articulo) AS articulos, ROUND(SUM(cantidad)) AS unidades, SUM(CASE WHEN cantidad<=0 THEN 1 ELSE 0 END) AS filas_cero, MAX(actualizado) AS act FROM stock GROUP BY deposito, sede ORDER BY deposito, sede"
          $r = Invoke-RestMethod "$b/consulta" -Method Post -Headers $h -ContentType 'application/json' -Body (@{ sql = $sql } | ConvertTo-Json)
          $r.filas | ForEach-Object { "deposito=$($_.deposito) sede=$($_.sede) articulos=$($_.articulos) unidades=$($_.unidades) filas_cero=$($_.filas_cero) act=$($_.act)" }
