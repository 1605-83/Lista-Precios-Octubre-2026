name: Control de stock de un articulo (temporal)
on: workflow_dispatch
jobs:
  control:
    runs-on: windows-latest
    steps:
      - name: Stock del articulo por deposito
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: |
          $h = @{ Authorization = "Bearer $env:GESCOM_LPE_CLAVE" }
          $b = 'https://datos-gescom.panelempresas.workers.dev'
          function Q($sql){ (Invoke-RestMethod "$b/consulta" -Method Post -Headers $h -ContentType 'application/json' -Body (@{ sql = $sql } | ConvertTo-Json)).filas }
          Q "SELECT deposito, sede, lote, vencimiento, cantidad, actualizado FROM stock WHERE articulo='1503118'" | ForEach-Object { "fila: dep=$($_.deposito) sede=$($_.sede) lote=$($_.lote) venc=$($_.vencimiento) cant=$($_.cantidad) act=$($_.actualizado)" }
          Q "SELECT area, ubicacion, cantidad, estado, actualizado FROM digip_stock WHERE articulo='1503118'" | ForEach-Object { "digip: area=$($_.area) ubic=$($_.ubicacion) cant=$($_.cantidad) estado=$($_.estado) act=$($_.actualizado)" }
          Q "SELECT que, marca, desde, actualizado, nota FROM sync WHERE que LIKE '%stock%'" | ForEach-Object { "sync: $($_.que) marca=$($_.marca) desde=$($_.desde) act=$($_.actualizado) nota=$($_.nota)" }
          Q "SELECT deposito, COUNT(*) AS filas, MIN(actualizado) AS mn, MAX(actualizado) AS mx FROM stock GROUP BY deposito" | ForEach-Object { "dep: $($_.deposito) filas=$($_.filas) min=$($_.mn) max=$($_.mx)" }
