name: Control de pedidos pendientes (temporal)
on: workflow_dispatch
jobs:
  control:
    runs-on: windows-latest
    steps:
      - name: Etapas y estados de ventas recientes (totales) y un articulo
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: |
          $h = @{ Authorization = "Bearer $env:GESCOM_LPE_CLAVE" }
          $b = 'https://datos-gescom.panelempresas.workers.dev'
          function Q($sql){ (Invoke-RestMethod "$b/consulta" -Method Post -Headers $h -ContentType 'application/json' -Body (@{ sql = $sql } | ConvertTo-Json)).filas }
          Q "SELECT tipo, etapa, estado, COUNT(*) AS n, MIN(fecha) AS f1, MAX(fecha) AS f2, SUM(CASE WHEN NULLIF(nro_comprobante,'') IS NULL THEN 1 ELSE 0 END) AS sin_nro FROM ventas WHERE fecha >= date('now','-3 day') GROUP BY tipo, etapa, estado ORDER BY tipo, etapa, estado" | ForEach-Object { "etapa: tipo=$($_.tipo) etapa=$($_.etapa) estado=$($_.estado) n=$($_.n) desde=$($_.f1) hasta=$($_.f2) sin_nro=$($_.sin_nro)" }
          Q "SELECT v.fecha, v.etapa, v.estado, i.cantidad, i.factor, v.comprobante FROM venta_items i JOIN ventas v ON v.id=i.venta_id WHERE i.articulo='1503118' AND v.fecha >= date('now','-5 day') ORDER BY v.fecha" | ForEach-Object { "art: fecha=$($_.fecha) etapa=$($_.etapa) estado=$($_.estado) cant=$($_.cantidad) factor=$($_.factor) comp=$($_.comprobante)" }
          Q "SELECT unidad, factor, default_venta FROM precios WHERE articulo='1503118' AND lista='1'" | ForEach-Object { "precio: unidad=$($_.unidad) factor=$($_.factor) defecto=$($_.default_venta)" }
