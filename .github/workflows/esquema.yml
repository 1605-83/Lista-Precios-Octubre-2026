name: Control de codigos de stock (temporal)
on: workflow_dispatch
jobs:
  control:
    runs-on: windows-latest
    steps:
      - name: Codigos de stock contra precios (productos, sin cantidades)
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: |
          $h = @{ Authorization = "Bearer $env:GESCOM_LPE_CLAVE" }
          $b = 'https://datos-gescom.panelempresas.workers.dev'
          function Q($sql){ (Invoke-RestMethod "$b/consulta" -Method Post -Headers $h -ContentType 'application/json' -Body (@{ sql = $sql } | ConvertTo-Json)).filas }
          "precios L1 con stock (mismo codigo): " + (Q "SELECT COUNT(DISTINCT p.articulo) AS n FROM precios p JOIN stock s ON s.articulo = p.articulo WHERE p.lista='1'").n
          "precios L1 total: " + (Q "SELECT COUNT(DISTINCT articulo) AS n FROM precios WHERE lista='1'").n
          "stock articulos sin precio L1: " + (Q "SELECT COUNT(DISTINCT s.articulo) AS n FROM stock s LEFT JOIN precios p ON p.articulo = s.articulo AND p.lista='1' WHERE p.articulo IS NULL").n
          "ejemplos stock sin precio: " + ((Q "SELECT DISTINCT s.articulo FROM stock s LEFT JOIN precios p ON p.articulo = s.articulo AND p.lista='1' WHERE p.articulo IS NULL LIMIT 12") | ForEach-Object { $_.articulo }) -join ' '
          "ejemplos precios sin stock: " + ((Q "SELECT DISTINCT p.articulo FROM precios p LEFT JOIN stock s ON s.articulo = p.articulo WHERE p.lista='1' AND s.articulo IS NULL LIMIT 12") | ForEach-Object { $_.articulo }) -join ' '
          "por proveedor (con stock / total): " + ((Q "SELECT a.proveedor AS pr, COUNT(DISTINCT p.articulo) AS t, COUNT(DISTINCT s.articulo) AS c FROM precios p JOIN articulos a ON a.codigo=p.articulo LEFT JOIN stock s ON s.articulo=p.articulo WHERE p.lista='1' GROUP BY a.proveedor ORDER BY t DESC LIMIT 25") | ForEach-Object { "$($_.pr):$($_.c)/$($_.t)" }) -join ' '
          "digip_stock articulos: " + (Q "SELECT COUNT(DISTINCT articulo) AS n, MAX(actualizado) AS a FROM digip_stock").n + " / " + (Q "SELECT MAX(actualizado) AS a FROM digip_stock").a
          "precios L1 con digip_stock: " + (Q "SELECT COUNT(DISTINCT p.articulo) AS n FROM precios p JOIN digip_stock s ON s.articulo = p.articulo WHERE p.lista='1'").n
