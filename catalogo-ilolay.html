<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Ilolay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: pensado para el celular. Un producto por renglon (foto chica a la izquierda, datos y precios a la derecha);
   en pantallas anchas, 2 o 3 columnas. Cada segmento arranca con una linea divisoria y su titulo. */
:root{
  --bg:#ffffff; --fg:#14181f; --muted:#5b6472; --line:#dde2ea; --soft:#f5f7fa;
  --marca:#d71e28; --on-marca:#ffffff;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.35;padding:0 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
header{padding-block:20px 12px}
h1{margin:0;font-size:1.5rem;font-weight:800;color:var(--marca)}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
/* segmentos: barra fija arriba, se desliza de costado en el celular */
.arriba{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);margin:0 -16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.buscar{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.buscar:focus-visible{outline:2px solid var(--marca);outline-offset:1px;border-color:var(--marca)}
.cuenta{font-size:.8rem;color:var(--muted);margin:6px 0 0}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--marca);background:var(--bg);border:1.5px solid var(--marca);border-radius:999px;padding:6px 12px;white-space:nowrap}
nav button.activa{background:var(--marca);color:var(--on-marca)}
nav button:not([data-seg="todos"]).activa::before{content:"✓ "}
nav button:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
section{margin-top:36px;padding-top:18px;border-top:3px solid var(--marca)}
section:first-of-type{margin-top:20px}
h2{margin:0 0 14px;font-size:1.15rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--marca);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2 small{font-size:.8rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.sub{margin-top:22px;padding-top:12px;border-top:3px solid var(--c)}
.sub:first-of-type{margin-top:6px}
h3{margin:0 0 12px;font-size:1rem;font-weight:800;color:var(--c);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h3 small{font-size:.8rem;font-weight:500;color:var(--muted)}
.sub[hidden]{display:none!important}
.lista{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.lista{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.lista{grid-template-columns:repeat(3,1fr)}}
.prod{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--marca);border-radius:10px;min-width:0;break-inside:avoid;page-break-inside:avoid}
.foto{width:120px;height:120px;aspect-ratio:1/1;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain;object-position:center;background:#fff}
.prod[hidden],section[hidden]{display:none!important}
mark{background:#fff1a8;color:inherit;padding:0}
.foto .sin{font-weight:800;font-size:.7rem;color:var(--marca);opacity:.45;letter-spacing:.05em;text-align:center;padding:4px}
.datos{min-width:0;display:flex;flex-direction:column;gap:3px}
.desc{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.cod{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.precios{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;align-items:baseline}
.precio{display:flex;align-items:baseline;gap:6px}
.precio span{font-size:.75rem;color:var(--muted)}
.precio b{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.precio.bulto b{font-size:1.05rem;color:var(--marca)}
.estado{color:var(--muted);margin-top:24px}
footer{margin-top:32px;color:var(--muted);font-size:.8rem}
/* boton Descargar PDF, arriba a la derecha (usa "Guardar como PDF" del navegador) */
header.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pdf{flex:0 0 auto;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--on-marca);background:var(--marca);border:0;border-radius:10px;padding:9px 14px;white-space:nowrap}
.pdf:hover{filter:brightness(1.15)}.pdf:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.pdf[disabled]{opacity:.6;cursor:wait}
/* sin stock (stock.json: Inventario > Stock Actual de Gescom, todos los depositos) */
.prod.sinst{border-color:#C62828}
.prod.sinst .foto img{opacity:.45;filter:grayscale(.6)}
.sinstock{display:inline-block;margin:4px 0 2px;padding:2px 9px;border-radius:999px;background:#C62828;color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
@media print{ .sinstock{-webkit-print-color-adjust:exact;print-color-adjust:exact} }@media print{ .pdf,.arriba{display:none!important} .prod{break-inside:avoid} header,h1,h2,section,.sub{-webkit-print-color-adjust:exact;print-color-adjust:exact} }@media print{
  @page{size:A4;margin:10mm}
  body{padding:0;font-size:11px}
  nav{display:none}
  .lista{grid-template-columns:repeat(2,1fr);gap:6px}
  .prod{grid-template-columns:70px 1fr;padding:6px}
  .foto{width:70px;height:70px}
  section{break-inside:auto;border-top-color:var(--marca);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h2{break-after:avoid}
}
/* Formato vitrina: tarjetas verticales con la foto grande arriba, 2/3/4 por fila, fondo crema (copiado del catalogo Cepas) */
:root{--soft:#faf6f0}
body{background:var(--soft)}
h1{color:var(--marca);font-size:1.8rem;letter-spacing:-.01em}
nav button{color:var(--marca);border-color:var(--marca)} nav button.activa{background:var(--marca)}
.arriba{background:var(--soft)}
section{border-top:0;margin-top:40px;padding-top:0}
h2{background:var(--marca);color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:18px}
h2 small{color:#f3e3c4}
.sub{border-top:0;padding-top:0}
h3{color:var(--fg);font-size:1.05rem;padding-left:10px;border-left:5px solid var(--c)}
.lista{grid-template-columns:repeat(2,1fr)!important;gap:12px}
@media (min-width:700px){.lista{grid-template-columns:repeat(3,1fr)!important}}
@media (min-width:1050px){.lista{grid-template-columns:repeat(4,1fr)!important}}
.prod{display:flex;flex-direction:column;align-items:stretch;padding:0;border:0;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);overflow:hidden;position:relative}
.foto{width:100%;height:auto;aspect-ratio:1/1;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.foto img{padding:10px}
.datos{padding:10px 12px 12px;gap:4px;flex:1}
.desc{font-size:.88rem;line-height:1.25;min-height:2.5em}
.cod{font-size:.7rem}
.precios{flex-direction:column;gap:2px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.precio{justify-content:space-between;flex-wrap:wrap;column-gap:6px}
.precio.bulto b{font-size:1.15rem;color:var(--marca)}
.prod.sinst{outline:2px solid #C62828}
.sinstock{position:absolute;top:8px;left:8px;margin:0;z-index:1}
.pdf{background:var(--marca)}
section .sub{color:var(--fg);font-size:inherit}
@media (max-width:520px){.precio.bulto b{font-size:.9rem}.precio b{font-size:.78rem}.precio span{font-size:.66rem}.datos{padding:9px 9px 11px}.desc{font-size:.82rem}.precio{gap:4px}}</style>
</head>
<body>
<div class="wrap">
  <header class="cab"><div>
    <h1>Catálogo Ilolay</h1>
    <p class="sub">Lago Puelo · Elebes · <span class="nlista">Lista 1</span> con IVA · <span id="vig"></span></p>
  </div><button type="button" class="pdf" id="btnPdf" onclick="descargarPDF()" title="Guardar el catálogo como PDF">⬇ Descargar PDF</button></header>
  <div class="arriba">
    <input class="buscar" id="q" type="search" placeholder="Buscar por código o descripción (ej. yogur, queso, 5200)" aria-label="Buscar producto" autocomplete="off">
    <p class="cuenta" id="cuenta" hidden></p>
    <nav id="nav" aria-label="Segmentos"></nav>
  </div>
  <div id="cat"><p class="estado">Cargando el catálogo…</p></div>
  <footer>Precios en pesos argentinos con IVA. Se actualizan solos cuando cambian en Gescom. Fotos ilustrativas.</footer>
</div>
<script>
// ?lista=2: la misma pagina con la Lista 2 (mayorista)
const L2 = new URLSearchParams(location.search).get('lista') === '2';
const DATOS = L2 ? 'datos-l2.json' : 'datos.json', DATOS_OTM = L2 ? 'datos-ilolay-l2.json' : 'datos-ilolay.json';
document.addEventListener('DOMContentLoaded', () => { if(L2) document.querySelectorAll('.nlista').forEach(e => e.textContent = 'Lista 2 mayorista'); });

// Segmentos del catalogo; el segmento de cada producto viene de segmentos-ilolay.json
const ORDEN = ['Leches','Línea +Proteína','Cremas y mantecas','Dulce de leche','Yogures','Quesos untables','Quesos','Ilolay Kids','Postres y flanes','Catering e industrial','Otros'];
const SUBLINEAS = {};
const fmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha = iso => iso ? iso.split('-').reverse().join('/') : '';
const limpiar = d => d.replace(/\s+/g,' ').trim();
const marca = d => 'ILOLAY';
const FOTOS_V = '2';   // cambiar cuando se reemplazan las fotos, para que el navegador no muestre las viejas
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// Segmentos tildados: ninguno = se ven todos; uno o varios = solo esos (se combinan con el buscador)
const elegidos = new Set();
function tildar(id){
  if (id === 'todos') elegidos.clear(); else if (elegidos.has(id)) elegidos.delete(id); else elegidos.add(id);
  document.querySelectorAll('nav button').forEach(b => {
    const on = b.dataset.seg === 'todos' ? elegidos.size === 0 : elegidos.has(b.dataset.seg);
    b.classList.toggle('activa', on); b.setAttribute('aria-pressed', on);
  });
  buscar();
  window.scrollTo({top: 0});
}
// Buscador: oculta los productos que no coinciden y los segmentos que quedan vacios o no estan tildados
function buscar(){
  const q = norm(document.getElementById('q').value.trim());
  const palabras = q.split(/\s+/).filter(Boolean);   // tienen que estar todas, en cualquier orden
  let n = 0;
  document.querySelectorAll('section').forEach(sec => {
    const tildado = elegidos.size === 0 || elegidos.has(sec.id);
    let vis = 0;
    sec.querySelectorAll('.prod').forEach(pr => { const ok = tildado && palabras.every(w => pr.dataset.buscar.includes(w)); pr.hidden = !ok; if (ok) vis++; });
    sec.querySelectorAll('.sub').forEach(s => { s.hidden = !s.querySelector('.prod:not([hidden])'); });
    sec.hidden = vis === 0; n += vis;
  });
  const c = document.getElementById('cuenta');
  const filtra = q || elegidos.size;
  c.hidden = !filtra; c.textContent = n ? `${n} ${n === 1 ? 'producto' : 'productos'}` : 'Ningún producto coincide con la búsqueda.';
}
function sinFoto(img, texto){ const s = document.createElement('span'); s.className = 'sin'; s.textContent = texto; img.replaceWith(s); }

Promise.all([DATOS_OTM, 'segmentos-ilolay.json'].map(u => fetch(u, {cache:'no-store'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }))).then(([d, SEG]) => {
  const l = d;   // datos-otm.json: {vigencia, productos}
  document.getElementById('vig').textContent = 'vigencia ' + fecha(l.vigencia);
  const grupos = ORDEN.map(nombre => ({nombre, prods: []}));
  for (const p of l.productos) { const i = ORDEN.indexOf(SEG[String(p[0])]); grupos[i < 0 ? ORDEN.length - 1 : i].prods.push(p); }
  const usados = grupos.filter(g => g.prods.length);
  document.getElementById('nav').innerHTML = `<button type="button" data-seg="todos" class="activa" aria-pressed="true">Todos</button>` +
    usados.map((g, i) => `<button type="button" data-seg="s${i}" aria-pressed="false">${esc(g.nombre)}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => tildar(b.dataset.seg)));
  const tarjeta = p => {
    const unidad = p[3] ? p[4] / p[3] : p[6];
    return `<article class="prod" data-cod="${esc(p[0])}" data-buscar="${esc(norm(p[0] + ' ' + p[1]))}">
      <div class="foto"><img src="img/ilolay/${esc(p[0])}.jpg?v=${FOTOS_V}" alt="${esc(limpiar(p[1]))}" loading="lazy" onerror="sinFoto(this,'${esc(marca(p[1]))}')"></div>
      <div class="datos">
        <div class="desc">${esc(limpiar(p[1]))}</div>
        <div class="cod">Cód. ${esc(p[0])}${p[3] ? ' · bulto x' + p[3] : ''}</div>
        <div class="precios">
          ${p[4] != null ? `<div class="precio bulto"><span>Bulto</span><b>${fmt.format(p[4])}</b></div>` : ''}
          ${p[3] ? `<div class="precio"><span>Unidad</span><b>${fmt.format(unidad)}</b></div>` : (unidad != null ? `<div class="precio bulto"><span>${p[7] === 'kg' ? 'Precio por kg' : 'Precio de lista'}</span><b>${fmt.format(unidad)}</b></div>` : '')}
        </div>
      </div>
    </article>`; };
  // Un segmento con sublineas se separa con una linea del color de cada linea
  const cuerpo = g => {
    const subs = SUBLINEAS[g.nombre];
    if (!subs) return `<div class="lista">${g.prods.map(tarjeta).join('')}</div>`;
    const partes = subs.map(([nombre, color]) => ({nombre, color, prods: []}));
    for (const p of g.prods) partes[subs.findIndex(([, , f]) => f(p[1]))].prods.push(p);
    return partes.filter(s => s.prods.length).map(s => `
      <div class="sub" style="--c:${s.color}">
        <h3>${esc(s.nombre)} <small>${s.prods.length} productos</small></h3>
        <div class="lista">${s.prods.map(tarjeta).join('')}</div>
      </div>`).join('');
  };
  document.getElementById('cat').innerHTML = usados.map((g, i) => `
    <section id="s${i}">
      <h2>${esc(g.nombre)} <small>${g.prods.length} productos</small></h2>
      ${cuerpo(g)}
    </section>`).join('');
  buscar();
}).catch(() => { document.getElementById('cat').innerHTML = '<p class="estado">No se pudo cargar el catálogo. Recargá la página en unos minutos.</p>'; });
document.getElementById('q').addEventListener('input', buscar);
</script>
<script>
// Descargar PDF: carga todas las fotos (vienen diferidas) y abre "Guardar como PDF" con el nombre del catalogo y la fecha
async function descargarPDF(){
  const b=document.getElementById('btnPdf'); b.disabled=true; const t0=b.textContent; b.textContent='Preparando…';
  const imgs=[...document.images]; imgs.forEach(i=>{ i.loading='eager'; });
  await Promise.race([Promise.all(imgs.map(i=>i.complete? 0 : new Promise(r=>{ i.addEventListener('load',r,{once:true}); i.addEventListener('error',r,{once:true}); }))), new Promise(r=>setTimeout(r,10000))]);
  const tit=document.title, h=new Date(Date.now()-3*3600e3).toISOString().slice(0,10).split('-').reverse().join('-');
  const lista=(document.querySelector('.nlista')||{}).textContent||'';
  document.title=`${document.querySelector('h1').textContent} - ${lista} - ${h}`;
  b.disabled=false; b.textContent=t0;
  window.print(); setTimeout(()=>{ document.title=tit; },1000);
}
</script><script>
// Sin stock: el robot deja en stock.json los productos sin unidades en ningun deposito (se revisa cada 5 minutos)
(function(){
  let SIN = new Set();
  function marcar(){
    document.querySelectorAll('.prod[data-cod]').forEach(c => {
      const sin = SIN.has(c.dataset.cod), b = c.querySelector('.sinstock');
      c.classList.toggle('sinst', sin);
      if(sin && !b){ const d = c.querySelector('.cod'); if(d) d.insertAdjacentHTML('afterend', '<div class="sinstock">Sin stock</div>'); }
      if(!sin && b) b.remove();
    });
  }
  async function leer(){
    try{ const r = await fetch('stock.json?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) return; const j = await r.json(); SIN = new Set((j.sin || []).map(String)); marcar(); }catch(e){}
  }
  let t = null; new MutationObserver(() => { clearTimeout(t); t = setTimeout(marcar, 50); }).observe(document.body, {childList:true, subtree:true});
  leer(); setInterval(() => { if(!document.hidden) leer(); }, 5*60*1000);
})();
</script></body>
</html>
